name: IT之家签到

on:
  schedule:
    - cron: '30 22 * * *'   # 北京时间次日 06:30
  workflow_dispatch:
    inputs:
      debug:
        description: '开启调试模式（输出详细日志）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    
     env:
  # ITHOME_USERHASH: ${{ secrets.ITHOME_USERHASH }}   # ← 注释掉这行
  ITHOME_PUSH: "1"
      ITHOME_PUSH: ${{ secrets.ITHOME_PUSH || '1' }}
      ITHOME_PUSH_URL: ${{ secrets.ITHOME_PUSH_URL }}
      DEBUG: ${{ inputs.debug || 'false' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pyDes
          fi

      - name: 检查密钥配置
        run: |
          if [ -z "$ITHOME_USERHASH" ]; then
            echo "::error::未配置 secrets.ITHOME_USERHASH，请在仓库 Settings → Secrets 中添加"
            exit 1
          fi
          echo "✅ 密钥已配置"

      - name: 执行签到
        run: |
          if [ "$DEBUG" = "true" ]; then
            export LOG_LEVEL=DEBUG
          fi
          python ithome_sign.py

      - name: 签到结果摘要
        if: always()
        run: |
          echo "### 签到任务完成" >> $GITHUB_STEP_SUMMARY
          echo "- 运行时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
