name: IT之家签到

on:
  schedule:
    - cron: '30 22 * * *'   # 北京时间次日 06:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ITHOME_USERHASH: ${{ secrets.ITHOME_USERHASH }}
      ITHOME_PUSH: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests pyDes

      - name: 执行签到
        run: python ithome_sign.py
