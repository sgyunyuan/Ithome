name: IT之家签到

on:
  schedule:
    - cron: '30 22 * * *'   # UTC 22:30 = 北京 06:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ITHOME_USERHASH: ${{ secrets.ITHOME_USERHASH }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      ITHOME_PUSH: "1"
      ITHOME_PUSH_URL: "https://api.chuckfang.com/shangguan/"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        run: python ithome_sign.py
