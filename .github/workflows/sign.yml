name: IT之家签到

on:
  schedule:
    - cron: '30 22 * * *'   # UTC 22:30 = 北京 06:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ITHOME_USERHASH: ${{ secrets.ITHOME_USERHASH }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        run: python ithome_sign.py

  # ========== 保活 ==========
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'schedule'
    steps:
      - run: echo "keepalive at $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
